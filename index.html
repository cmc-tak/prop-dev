<style>

button{width:100%;font:inherit;font-weight:600;padding:10px;border:0;background:var(--accent);color:var(--panel);cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:21px;margin:10px 0 0;font-size:14px;color:var(--err)}
</style>

const STORE = 'ledger-key';
const bytes = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = (a) => btoa(String.fromCharCode(...new Uint8Array(a)));
const store = {
  get() { try { return localStorage.getItem(STORE); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(STORE, v); } catch (e) {} },
  del() { try { localStorage.removeItem(STORE); } catch (e) {} },
};
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(P.salt), iterations: P.iter }, base, 256);
}
async function unlock(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const out = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bytes(P.ct));
  return new TextDecoder().decode(out);
}
function show(html) {
  const d = new DOMParser().parseFromString(html, 'text/html');
  document.head.replaceWith(d.head);
  document.body.replaceWith(d.body);

  document.querySelectorAll('script').forEach(o => {
    const n = document.createElement('script');
    n.textContent = o.textContent;
    o.replaceWith(n);

    if (document.getElementById('r').checked) store.set(b64(raw));
    show(html);

    msg.textContent = 'That password did not work.';
    b.disabled = false;
